# .pre-commit-config.yaml
# Run: pip install pre-commit && pre-commit install
# Then: pre-commit run --all-files
#
# This configuration prevents secrets from being committed.
# gitleaks detects hardcoded secrets, API keys, tokens, and
# other sensitive information before they enter git history.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        description: Scans for secrets before they enter git history.
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
