[project]
name = "securevault-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.32.1", "sqlalchemy==2.0.36", "asyncpg==0.30.0", "alembic==1.14.0", "argon2-cffi==23.1.0", "PyJWT[cryptography]==2.10.1", "pydantic-settings==2.7.0", "cryptography==44.0.0", "aiohttp==3.11.11", "redis>=5.0.0"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["app"]
[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1", "psycopg[binary]==3.2.3", "locust>=2.29.0", "pip-audit>=2.7.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires an explicit SECUREVAULT_TEST_DATABASE_URL PostgreSQL instance"]
